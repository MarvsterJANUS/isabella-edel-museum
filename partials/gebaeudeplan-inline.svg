<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 828 502" class="plan-svg" role="group" aria-labelledby="plan-title"><title id="plan-title">Isometrischer Gebäudeplan des Isabella-Edel-Museums</title><defs><style>
.pl-floor{fill:#ECE9F4;stroke:#2B2B2A;stroke-width:1}
.pl-wall-back-a{fill:#C9C4D6;stroke:#2B2B2A;stroke-width:1}
.pl-wall-back-b{fill:#B3ADC4;stroke:#2B2B2A;stroke-width:1}
.pl-wall-front-a,.pl-wall-front-b{fill:#FFFFFF;stroke:#2B2B2A;stroke-width:1.5;stroke-linejoin:round}
.pl-wall-front-b{fill:#F4F2EE}
.pl-door{fill:#DDE6EE;stroke:#2B2B2A;stroke-width:1}

.pl-room{cursor:pointer;outline:none}
.pl-room .pl-floor,.pl-room polygon{transition:fill .25s ease}
.pl-room:hover .pl-floor,.pl-room:focus-visible .pl-floor,.pl-room.is-active .pl-floor{fill:#443189}
.pl-room:hover .pl-wall-back-a,.pl-room:focus-visible .pl-wall-back-a,.pl-room.is-active .pl-wall-back-a{fill:#7D6FB5}
.pl-room:hover .pl-wall-back-b,.pl-room:focus-visible .pl-wall-back-b,.pl-room.is-active .pl-wall-back-b{fill:#6A5BA6}
.pl-room:focus-visible .pl-wall-front-a,.pl-room:focus-visible .pl-wall-front-b{stroke:#443189;stroke-width:3}
.pl-label{opacity:0;transition:opacity .2s ease;pointer-events:none}
.pl-label rect{fill:#2B2B2A}
.pl-label text{fill:#FFFFFF;font:600 15px "Source Sans 3","Segoe UI",Arial,sans-serif}
@media (prefers-reduced-motion:reduce){.pl-room polygon,.pl-label{transition:none}}
