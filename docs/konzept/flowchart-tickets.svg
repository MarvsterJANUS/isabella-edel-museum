<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="940" viewBox="0 0 1100 940"><title>Flowchart Tickets</title><rect x="0" y="0" width="1100" height="940" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="600" fill="#2B2B2A">Flowchart – Ticketreservierung</text><text x="40" y="80" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="400" fill="#6E6A64">Rein clientseitig: keine Datenübertragung, laut Aufgabe keine Formularfunktion gefordert</text><rect x="330" y="110" width="240" height="50" rx="25" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="140" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">Seite „Tickets“</text><path d="M450 160 L450 200" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,200 446.5,191.7 453.5,191.7" fill="#2B2B2A"/><rect x="280" y="200" width="340" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="228" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">1 · Ticketart wählen</text><text x="450" y="246" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Erwachsene 10 € · Ermäßigte 8 € (Anzahl)</text><path d="M450 264 L450 304" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,304 446.5,295.7 453.5,295.7" fill="#2B2B2A"/><rect x="280" y="304" width="340" height="50" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="334" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Summe wird live berechnet (JS)</text><path d="M450 354 L450 394" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,394 446.5,385.7 453.5,385.7" fill="#2B2B2A"/><rect x="280" y="394" width="340" height="50" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="424" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">„Auswahl bestätigen“</text><path d="M450 444 L450 474" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,474 446.5,465.7 453.5,465.7" fill="#2B2B2A"/><polygon points="450,474 590,524 450,574 310,524" fill="#ECE9F4" stroke="#443189" stroke-width="1.5"/><text x="450" y="529" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">mind. 1 Ticket?</text><path d="M590 524 L800 524 L800 420 L620 420" fill="none" stroke="#443189" stroke-width="1.6"/><polygon points="620,420 628.3,416.5 628.3,423.5" fill="#443189"/><text x="860" y="470" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">nein: Hinweis</text><text x="812" y="490" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="400" fill="#6E6A64">„Bitte wählen Sie mindestens</text><text x="812" y="506" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="400" fill="#6E6A64">ein Ticket aus.“</text><path d="M450 574 L450 614" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,614 446.5,605.7 453.5,605.7" fill="#2B2B2A"/><text x="462" y="600" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">ja</text><rect x="280" y="614" width="340" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="642" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">2 · Persönliche Angaben</text><text x="450" y="660" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Vorname**, Name**, E-Mail** …</text><path d="M450 678 L450 718" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,718 446.5,709.7 453.5,709.7" fill="#2B2B2A"/><rect x="280" y="718" width="340" height="50" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="748" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">„Bestellung abschließen und Tickets kaufen“</text><path d="M450 768 L450 808" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="450,808 446.5,799.7 453.5,799.7" fill="#2B2B2A"/><rect x="280" y="808" width="340" height="64" rx="32" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="450" y="836" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">3 · Bestätigungsseite</text><text x="450" y="854" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">Ticket drucken / als PDF speichern</text><rect x="40" y="300" width="210" height="120" rx="4" fill="#F8F6F2" stroke="#C9C6C0" stroke-width="1" stroke-dasharray="5 4"/><text x="56" y="326" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2A">Ohne JavaScript:</text><text x="56" y="346" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2A">Formular komplett sichtbar,</text><text x="56" y="366" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2A">Pflichtfelder prüft der</text><text x="56" y="386" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2A">Browser (required).</text><text x="860" y="760" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="600" fill="#2B2B2A">Legende</text><rect x="860" y="772" width="40" height="20" rx="10" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="912" y="787" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="400" fill="#2B2B2A">Start / Ende</text><rect x="860" y="802" width="40" height="20" rx="3" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="912" y="817" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="400" fill="#2B2B2A">Aktion / Ansicht</text><polygon points="880,830 900,842 880,854 860,842" fill="#ECE9F4" stroke="#443189" stroke-width="1.5"/><text x="912" y="847" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="400" fill="#2B2B2A">Entscheidung</text></svg>
