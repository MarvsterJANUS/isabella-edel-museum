ial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">(nicht anklickbar)</text><path d="M260 394 L260 440" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="260,440 256.5,431.7 263.5,431.7" fill="#2B2B2A"/><rect x="130" y="440" width="260" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="260" y="468" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Legende unter dem Plan</text><text x="260" y="486" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">(Piktogramm + Name)</text><path d="M260 504 L260 550" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="260,550 256.5,541.7 263.5,541.7" fill="#2B2B2A"/><rect x="130" y="550" width="260" height="50" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="260" y="580" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Tipp auf Legendenpunkt</text><path d="M800 260 L1040 260 L1040 330" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="1040,330 1036.5,321.7 1043.5,321.7" fill="#2B2B2A"/><text x="860" y="250" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">ja</text><rect x="910" y="330" width="260" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="1040" y="358" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Gebäudeplan als Inline-SVG</text><text x="1040" y="376" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">(Räume sind Links)</text><path d="M1040 394 L1040 440" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="1040,440 1036.5,431.7 1043.5,431.7" fill="#2B2B2A"/><rect x="91