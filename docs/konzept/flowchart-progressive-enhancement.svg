<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940"><title>Flowchart Progressive Enhancement</title><rect x="0" y="0" width="1300" height="940" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="600" fill="#2B2B2A">Flowchart – Progressive Enhancement (Mobile First)</text><text x="40" y="80" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="400" fill="#6E6A64">Jede Stufe baut auf der vorherigen auf – der Inhalt ist auf jedem Gerät erreichbar</text><rect x="540" y="110" width="220" height="50" rx="25" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="650" y="140" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">Seite wird geladen</text><path d="M650 160 L650 200" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="650,200 646.5,191.7 653.5,191.7" fill="#2B2B2A"/><rect x="470" y="200" width="360" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="650" y="228" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Stufe 1: semantisches HTML5</text><text x="650" y="246" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Inhalt, Links, Sprungmarken, Formular</text><path d="M650 264 L650 304" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="650,304 646.5,295.7 653.5,295.7" fill="#2B2B2A"/><rect x="470" y="304" width="360" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="650" y="332" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Stufe 2: CSS Mobile First</text><text x="650" y="350" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Basis = Smartphone, dann min-width</text><path d="M650 368 L650 408" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="650,408 646.5,399.7 653.5,399.7" fill="#2B2B2A"/><polygon points="650,413 810,468 650,523 490,468" fill="#ECE9F4" stroke="#443189" stroke-width="1.5"/><text x="650" y="473" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">Viewport-Breite?</text><path d="M490 468 L230 468 L230 560" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="230,560 226.5,551.7 233.5,551.7" fill="#2B2B2A"/><text x="330" y="458" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">&lt; 576 px</text><path d="M650 523 L650 560" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="650,560 646.5,551.7 653.5,551.7" fill="#2B2B2A"/><text x="662" y="548" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">≥ 576 px</text><path d="M810 468 L1070 468 L1070 560" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="1070,560 1066.5,551.7 1073.5,551.7" fill="#2B2B2A"/><text x="900" y="458" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">≥ 1400 px</text><rect x="110" y="560" width="240" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="230" y="588" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">einspaltig, 20 px Rand</text><text x="230" y="606" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Plan als &lt;img&gt; + Legende</text><rect x="530" y="560" width="240" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="650" y="588" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">zweispaltig, 40 px Rand</text><text x="650" y="606" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Plan klickbar (SVG)</text><rect x="950" y="560" width="240" height="64" rx="4" fill="#FFFFFF" stroke="#2B2B2A" stroke-width="1.5"/><text x="1070" y="588" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">horizontales Menü,</text><text x="1070" y="606" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#2B2B2A" text-anchor="middle">Raster 5 : 7, max. 1320 px</text><path d="M230 624 V652 H1070 V624 M650 624 V652" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><path d="M650 652 L650 680" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="650,680 646.5,671.7 653.5,671.7" fill="#2B2B2A"/><polygon points="650,680 810,735 650,790 490,735" fill="#ECE9F4" stroke="#443189" stroke-width="1.5"/><text x="650" y="731" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">moderner Browser?</text><text x="650" y="749" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A" text-anchor="middle">(„Cutting the Mustard“)</text><path d="M490 735 L340 735 L340 810" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="340,810 336.5,801.7 343.5,801.7" fill="#2B2B2A"/><text x="400" y="725" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">nein</text><path d="M810 735 L960 735 L960 810" fill="none" stroke="#2B2B2A" stroke-width="1.6"/><polygon points="960,810 956.5,801.7 963.5,801.7" fill="#2B2B2A"/><text x="880" y="725" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" fill="#443189">ja</text><rect x="140" y="810" width="400" height="84" rx="4" fill="#F8F6F2" stroke="#2B2B2A" stroke-width="1.5"