<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180"><title>Styleguide</title><rect x="0" y="0" width="1500" height="1180" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="600" fill="#2B2B2A">Styleguide – Farbe, Typografie, Raster, Stilelemente</text><text x="40" y="80" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="400" fill="#6E6A64">Gestaltungsidee „Macherin statt Muse“: die Website als weiße Galeriewand – die Farbe liefern die Gemälde</text><text x="40" y="140" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="600" fill="#2B2B2A">Farbe</text><rect x="40" y="160" width="230" height="130" rx="4" fill="#F8F6F2" stroke="#C9C6C0" stroke-width="1"/><text x="40" y="316" font-family="'Source Sans 3', Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2B2A">Galerieweiß</text><text x="40" y="336" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">#F8F6F2</text><text x="40" y="356" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#6E6A64">Hintergrund, wärmer als Reinweiß</text><rect x="300" y="160" width="230" height="130" rx="4" fill="#2B2B2A" stroke="#C9C6C0" stroke-width="1"/><text x="300" y="316" font-family="'Source Sans 3', Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2B2A">Anthrazit</text><text x="300" y="336" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">#2B2B2A</text><text x="300" y="356" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#6E6A64">Text, Fußzeile (aus dem Logo)</text><rect x="560" y="160" width="230" height="130" rx="4" fill="#443189" stroke="#C9C6C0" stroke-width="1"/><text x="560" y="316" font-family="'Source Sans 3', Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2B2A">Violett</text><text x="560" y="336" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">#443189</text><text x="560" y="356" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#6E6A64">einzige Akzentfarbe (aus dem Logo)</text><rect x="820" y="160" width="230" height="130" rx="4" fill="#ECE9F4" stroke="#C9C6C0" stroke-width="1"/><text x="820" y="316" font-family="'Source Sans 3', Arial, sans-serif" font-size="16" font-weight="600" fill="#2B2B2A">Violett hell</text><text x="820" y="336" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">#ECE9F4</text><text x="820" y="356" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="400" fill="#6E6A64">Flächen, Böden im Gebäudeplan</text><text x="1100" y="190" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A">Kontrast Violett auf Galerieweiß</text><text x="1100" y="212" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">ca. 10 : 1 → WCAG AA erfüllt</text><text x="1100" y="250" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2B2A">Dunkler Modus</text><text x="1100" y="272" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">tauscht nur die Farbvariablen</text><text x="40" y="430" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="600" fill="#2B2B2A">Typografie</text><text x="40" y="500" font-family="'Cormorant Garamond', Georgia, serif" font-size="46" font-weight="600" fill="#2B2B2A">Cormorant Garamond</text><text x="40" y="528" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">Garalde · Überschriften, Zitate, Zahlen · ab 24 px · Versalziffern</text><text x="40" y="590" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="600" fill="#2B2B2A">Macherin statt Muse</text><text x="40" y="636" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="500" font-style="italic" fill="#2B2B2A">„Jede neue Idee ist eine Aggression.“</text><text x="40" y="690" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" fill="#443189">300</text><text x="190" y="690" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" fill="#443189">42</text><text x="300" y="690" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" fill="#443189">4</text><text x="780" y="500" font-family="'Source Sans 3', Arial, sans-serif" font-size="40" font-weight="600" fill="#2B2B2A">Source Sans 3</text><text x="780" y="528" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">serifenlose Linear-Antiqua · Fließtext, Menü, Formulare</text><text x="780" y="576" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="400" fill="#2B2B2A">Frauen sind in deutschen Kunstmuseen noch immer unterrepräsentiert:</text><text x="780" y="606" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="400" fill="#2B2B2A">Weniger als 10 Prozent der ausgestellten Bilder wurden von</text><text x="780" y="636" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="400" fill="#2B2B2A">Künstlerinnen gemalt.</text><text x="780" y="690" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6A64">17–19 px · Zeilenabstand 1,7 · ca. 65 Zeichen pro Zeile · linksbündig</text><text x="40" y="790" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="600" fill="#2B2B2A">Raster &amp; Breakpoints</text><rect x="40" y="820" width="150" height="220" fill="#F8F6F2" stroke="#C9C6C0" stroke-width="1"/><rect x="47" y="832" width="136" height="196" fill="#D9D3F2" fill-opacity="0.8"/><te